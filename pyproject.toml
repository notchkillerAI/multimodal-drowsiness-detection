[project]
name = "driver-drowsiness"
version = "0.1.0"
description = "Real-time multimodal driver-drowsiness detection: EAR, eye-state CNN and EOG branches with confidence-weighted fusion"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Arpan Bhattacharya" }]
# The pinned, tested versions are in requirements.txt (install with: pip install -r requirements-dev.txt)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drowsiness*"]

[tool.setuptools.package-data]
"drowsiness.dashboard" = ["static/*"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = [".venv", "data", "models", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]   # short names such as l / r (left / right eye) are clear here; zip() always gets equal lengths

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E402", "B007"]      # notebooks may have long explanatory lines and imports after a setup step

[tool.ruff.lint.isort]
known-first-party = ["drowsiness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: executes whole notebooks (several minutes); run with  pytest -m slow"]
addopts = "-m 'not slow'"
