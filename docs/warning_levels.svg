<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Warning levels: from the fused score, EARLY WARNING above 0.4 and DROWSY above 0.6 held for 3 seconds; from one eye closure, MICROSLEEP at 1 second, SLEEP at 3 seconds, UNRESPONSIVE at 6 seconds">
  <rect width="1000" height="330" rx="16" fill="#0d1117"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="50" fill="#f0f4fa" font-size="26" font-weight="700">Two roads to a warning</text>

    <!-- score road -->
    <text x="40" y="96" fill="#8b98ad" font-size="15" letter-spacing="1">SLOW: THE FUSED SCORE (smoothed 3 s, must stay high 3 s)</text>
    <rect x="40" y="110" width="368" height="40" rx="8" fill="#2f9e5b"/>
    <rect x="412" y="110" width="180" height="40" rx="8" fill="#e7b416"/>
    <rect x="596" y="110" width="364" height="40" rx="8" fill="#e5484d"/>
    <g font-size="16" font-weight="700" text-anchor="middle">
      <text x="224" y="136" fill="#fff">ALERT</text>
      <text x="502" y="136" fill="#1b1b1b">EARLY WARNING</text>
      <text x="778" y="136" fill="#fff">DROWSY</text>
    </g>
    <g fill="#aab6c8" font-size="14" text-anchor="middle">
      <text x="40" y="172">0</text><text x="410" y="172">0.4</text><text x="594" y="172">0.6</text><text x="960" y="172">1.0</text>
    </g>

    <!-- closure road -->
    <text x="40" y="218" fill="#8b98ad" font-size="15" letter-spacing="1">FAST: ONE EYE CLOSURE (camera branches, shown at once; Euro NCAP levels)</text>
    <rect x="40" y="232" width="140" height="40" rx="8" fill="#26303f"/>
    <rect x="184" y="232" width="276" height="40" rx="8" fill="#a3262b"/>
    <rect x="464" y="232" width="416" height="40" rx="8" fill="#6e1a1d"/>
    <rect x="884" y="232" width="76" height="40" rx="8" fill="#3a0d0f" stroke="#a3262b"/>
    <g font-size="16" font-weight="700" text-anchor="middle" fill="#fff">
      <text x="110" y="258" fill="#aab6c8">blink</text>
      <text x="322" y="258">MICROSLEEP</text>
      <text x="672" y="258">SLEEP</text>
      <text x="922" y="258" font-size="12">UNRESP.</text>
    </g>
    <g fill="#aab6c8" font-size="14" text-anchor="middle">
      <text x="40" y="294">0 s</text><text x="182" y="294">1 s</text><text x="462" y="294">3 s</text><text x="882" y="294">6 s</text>
    </g>
    <text x="960" y="318" fill="#5b6b82" font-size="13" text-anchor="end">a confident branch that sees open eyes vetoes the fast road</text>
  </g>
</svg>
