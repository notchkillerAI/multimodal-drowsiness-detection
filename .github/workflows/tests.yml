# Lint and fast tests on every push and pull request.
# The trained eye model (models/eye_state.onnx) and the datasets are not in git, so the tests that need them skip here.
name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: macos-latest   # the project is developed on Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python download_models.py
      - run: ruff check . && ruff format --check .
      - run: python -m pytest
